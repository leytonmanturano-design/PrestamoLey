<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Préstamos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabecera con botón de menú -->
  <header class="header">
    <button id="btn-menu" class="btn-icon" aria-label="Abrir menú">☰</button>
    <h1>Gestión de Préstamos</h1>
  </header>

  <!-- Menú Lateral (Drawer / Tres rayitas) -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Configuración</h2>
      <button id="btn-close-sidebar" class="btn-close">&times;</button>
    </div>
    <div class="sidebar-content">
      <div class="form-group">
        <label for="input-capital-sidebar">Capital Total:</label>
        <input type="number" id="input-capital-sidebar" step="0.01" placeholder="Ej. 10000">
        <button id="btn-save-capital" class="btn-primary">Guardar Capital</button>
      </div>
    </div>
  </aside>
  <div id="sidebar-overlay" class="overlay"></div>

  <!-- Contenido Principal -->
  <main class="main-container">
    <section class="card summary-card">
      <h2>Capital Actual</h2>
      <p id="display-capital" class="capital-amount">$0.00</p>
    </section>

    <section class="card form-card">
      <h2>Registrar Nuevo Préstamo</h2>
      <form id="loan-form">
        <div class="form-group">
          <label for="cliente">Nombre del Cliente:</label>
          <input type="text" id="cliente" required placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
          <label for="monto">Monto del Préstamo:</label>
          <input type="number" id="monto" step="0.01" required placeholder="Ej. 1500">
        </div>
        <button type="submit" class="btn-primary">Registrar Préstamo</button>
      </form>
    </section>

    <section class="card table-card">
      <h2>Historial de Préstamos</h2>
      <table id="loans-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="loans-tbody">
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
